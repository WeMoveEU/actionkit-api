[project]
name = "actionkit"
version = "0.3.9"
description = "ActionKit API python client"
readme = "README.txt"
requires-python = ">=3.11"
authors = [
    {name = "Aaron Ross", email = "tech@wemove.eu"}
]
dependencies = [
    "requests",
    # Sole use site: actionkit/uploads.py (MultipartEncoderMonitor, streaming
    # multipart upload with a progress callback).
    "requests-toolbelt",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["actionkit"]

[dependency-groups]
dev = [
    "pytest>=7.0.1",
]
