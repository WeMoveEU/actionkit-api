# Tier 3: nothing here auto-merges. Dependabot opens one batched PR per ecosystem
# each Monday and a maintainer decides when actionkit ships, since releases are cut
# by hand via the v* tag that triggers .github/workflows/release.yml.
version: 2
updates:
  # Python deps are uv-managed: uv.lock + pyproject.toml [dependency-groups] at the
  # repo root. Deliberately "uv", not "pip" — pip would resolve the wrong backend.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      uv-minor-patch:
        update-types: ["minor", "patch"]
      # Security updates are a separate stream; without this group they arrive one PR per
      # advisory, which is what built the queues that got bulk-closed. A GROUPED PR is also
      # the only kind `@dependabot unignore` works on. Canonical shape: dependency-policy
      # templates/tier*.yml.
      uv-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # .github/workflows/release.yml pins a reusable workflow ref that needs bumping.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]
      # Security updates are a separate stream; without this group they arrive one PR per
      # advisory, which is what built the queues that got bulk-closed. A GROUPED PR is also
      # the only kind `@dependabot unignore` works on. Canonical shape: dependency-policy
      # templates/tier*.yml.
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
