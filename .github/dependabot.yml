# Tier 3: nothing here auto-merges. Dependabot opens one batched PR per ecosystem
# each Monday and a maintainer decides when actionkit ships, since releases are cut
# by hand via the v* tag that triggers .github/workflows/release.yml.
version: 2
updates:
  # Python deps are uv-managed: uv.lock + pyproject.toml [dependency-groups] at the
  # repo root. Deliberately "uv", not "pip" — pip would resolve the wrong backend.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      uv-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # .github/workflows/release.yml pins a reusable workflow ref that needs bumping.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
